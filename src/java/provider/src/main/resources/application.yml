spring:
  application:
    name: provider-validation
  profiles:
    active: dev

---
# Development profile — in-memory H2, schema seeded from schema.sql
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:providerdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8081

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

---
# AWS profile — Aurora PostgreSQL (credentials from Secrets Manager / env)
spring:
  config:
    activate:
      on-profile: aws
  datasource:
    url: ${PROVIDER_DB_URL}
    driver-class-name: org.postgresql.Driver
    username: ${PROVIDER_DB_USER}
    password: ${PROVIDER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

server:
  port: 8081
