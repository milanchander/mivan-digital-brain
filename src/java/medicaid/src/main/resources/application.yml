spring:
  application:
    name: medicaid-claim-processing

  datasource:
    url: jdbc:h2:mem:medicaiddb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8083

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.mivan.medicaid: DEBUG
    org.hibernate.SQL: WARN

---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${MEDICAID_DB_URL}
    username: ${MEDICAID_DB_USER}
    password: ${MEDICAID_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
